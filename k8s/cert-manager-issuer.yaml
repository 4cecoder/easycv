# =============================================================================
# Let's Encrypt ClusterIssuer for cert-manager
# =============================================================================
#
# Creates a ClusterIssuer that uses Let's Encrypt production CA to
# automatically provision and renew TLS certificates.
#
# Prerequisites:
#   cert-manager must be installed in the cluster:
#     kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml
#
# Apply:
#   kubectl apply -f k8s/cert-manager-issuer.yaml
#
# Verify:
#   kubectl get clusterissuer letsencrypt-prod -o yaml
#
# =============================================================================

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production endpoint
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email for certificate expiry notifications
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
