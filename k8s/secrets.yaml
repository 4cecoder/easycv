# =============================================================================
# easyCV Secrets
# =============================================================================
#
# IMPORTANT: Do NOT commit real values to version control.
# This file contains placeholder base64 values. The deploy.sh script reads
# from .env.production and generates this manifest dynamically.
#
# To manually generate a base64 value:
#   echo -n 'your-actual-value' | base64
#
# To decode a base64 value:
#   echo 'base64-encoded-value' | base64 --decode
#
# To apply manually after editing:
#   kubectl apply -f k8s/secrets.yaml -n easycv
#
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: easycv-secrets
  namespace: easycv
  labels:
    app.kubernetes.io/part-of: easycv
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # ── Convex Self-Hosted Secrets ────────────────────────────────────────────
  # INSTANCE_SECRET (generate with: openssl rand -hex 32)
  INSTANCE_SECRET: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # POSTGRES_URL (PostgreSQL connection string, e.g. postgres://user:pass@easycv-postgres:5432/easycv or Vultr Managed Postgres)
  # Leave empty or omit if using SQLite with PersistentVolume
  POSTGRES_URL: ""

  # POSTGRES_PASSWORD (for in-cluster PostgreSQL)
  POSTGRES_PASSWORD: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # CONVEX_SELF_HOSTED_ADMIN_KEY (<INSTANCE_NAME>|<INSTANCE_SECRET>)
  CONVEX_SELF_HOSTED_ADMIN_KEY: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # CONVEX_URL (server-side, e.g. http://convex-backend:3210 or public URL)
  CONVEX_URL: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # ── Application ───────────────────────────────────────────────────────────
  # APP_URL (public URL, e.g. https://easycv.yourdomain.com)
  # Example: echo -n 'https://easycv.yourdomain.com' | base64
  APP_URL: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # ── Stripe ────────────────────────────────────────────────────────────────
  # STRIPE_SECRET_KEY
  # Example: echo -n 'sk_live_...' | base64
  STRIPE_SECRET_KEY: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # STRIPE_WEBHOOK_SECRET
  # Example: echo -n 'whsec_...' | base64
  STRIPE_WEBHOOK_SECRET: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # STRIPE_PRICE_ID
  # Example: echo -n 'price_...' | base64
  STRIPE_PRICE_ID: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # STRIPE_PRO_PRICE_ID
  # Example: echo -n 'price_...' | base64
  STRIPE_PRO_PRICE_ID: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # ── Worker Auth ───────────────────────────────────────────────────────────
  # WORKER_SECRET (generate with: openssl rand -hex 32)
  # Example: echo -n 'f84366a71052f16dfd8ea0f486f3ead1a1718b0a99f43d6040128dcf3a76fee6' | base64
  WORKER_SECRET: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # ── LLM API Keys (conditional, only set the one matching LLM_PROVIDER) ────
  # OPENAI_API_KEY (if LLM_PROVIDER=openai)
  # Example: echo -n 'sk-...' | base64
  OPENAI_API_KEY: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=

  # ANTHROPIC_API_KEY (if LLM_PROVIDER=anthropic)
  # Example: echo -n 'sk-ant-...' | base64
  ANTHROPIC_API_KEY: Q0hBTkdFLU1FLWluLXByb2R1Y3Rpb24=
