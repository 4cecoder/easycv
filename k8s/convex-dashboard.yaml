apiVersion: apps/v1
kind: Deployment
metadata:
  name: convex-dashboard
  namespace: easycv
  labels:
    app: convex-dashboard
    app.kubernetes.io/name: convex-dashboard
    app.kubernetes.io/component: admin-dashboard
    app.kubernetes.io/part-of: easycv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convex-dashboard
  template:
    metadata:
      labels:
        app: convex-dashboard
        app.kubernetes.io/name: convex-dashboard
    spec:
      containers:
        - name: convex-dashboard
          image: ghcr.io/get-convex/convex-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: dashboard
              containerPort: 6791
              protocol: TCP
          env:
            - name: PORT
              value: "6791"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_CONVEX_URL
              valueFrom:
                configMapKeyRef:
                  name: easycv-config
                  key: NEXT_PUBLIC_CONVEX_URL
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 6791
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6791
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: convex-dashboard
  namespace: easycv
  labels:
    app: convex-dashboard
    app.kubernetes.io/name: convex-dashboard
    app.kubernetes.io/component: admin-dashboard
    app.kubernetes.io/part-of: easycv
spec:
  type: ClusterIP
  selector:
    app: convex-dashboard
  ports:
    - name: dashboard
      port: 6791
      targetPort: 6791
      protocol: TCP
