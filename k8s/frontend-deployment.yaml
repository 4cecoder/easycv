apiVersion: apps/v1
kind: Deployment
metadata:
  name: easycv-frontend
  namespace: easycv
  labels:
    app: easycv-frontend
    app.kubernetes.io/part-of: easycv
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easycv-frontend
  # Recreate: the cluster is one small node. RollingUpdate with maxUnavailable:0
  # tries to run two frontend pods at once and the new replica never becomes Ready.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: easycv-frontend
        app.kubernetes.io/part-of: easycv
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: vultr-registry-credentials
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: atl.vultrcr.com/seridian/easycv-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            # Tiny CPU requests: the node is 1 vCPU. kube-system already consumes
            # most of it; 50m+100m left the worker Pending (Insufficient cpu).
            requests:
              memory: 128Mi
              cpu: 10m
            limits:
              memory: 512Mi
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: easycv-secrets
            - configMapRef:
                name: easycv-config
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
