# =============================================================================
# easyCV Ingress — Traefik with Let's Encrypt TLS
# =============================================================================
#
# Uses Traefik IngressRoute CRDs for full middleware control.
# Cert-manager provisions Let's Encrypt certs automatically.
#
# Prerequisites:
#   1. Traefik installed (default on Vultr VKE)
#   2. cert-manager installed (kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml)
#   3. ClusterIssuer created (see cert-manager-issuer.yaml)
#   4. cert-manager Traefik CRD webhook installed:
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/deploy/manifests/00-crds.yaml
#
# Apply:
#   kubectl apply -f k8s/ingress.yaml -n easycv
#
# =============================================================================

# ── Rate Limit Middleware ────────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: easycv-rate-limit
  namespace: easycv
spec:
  rateLimit:
    average: 10
    burst: 50
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1

---
# ── CORS Middleware ──────────────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: easycv-cors
  namespace: easycv
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
      - Accept
      - X-Requested-With
    accessControlAllowOriginList:
      - "https://your-domain.com"
      - "https://*.convex.cloud"
    accessControlMaxAge: 86400
    addVaryHeader: true

---
# ── Security Headers Middleware ──────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: easycv-security-headers
  namespace: easycv
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    browserXssFilter: true
    customResponseHeaders:
      X-Powered-By: ""

---
# ── HTTPS Redirect Middleware ────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: easycv-https-redirect
  namespace: easycv
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# ── Frontend IngressRoute ───────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: easycv-frontend
  namespace: easycv
  labels:
    app: easycv-frontend
    app.kubernetes.io/part-of: easycv
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Main domain
    - match: Host(`your-domain.com`) || Host(`www.your-domain.com`)
      kind: Rule
      middlewares:
        - name: easycv-rate-limit
        - name: easycv-cors
        - name: easycv-security-headers
        - name: easycv-https-redirect
      services:
        - name: easycv-frontend
          port: 80

  tls:
    secretName: easycv-tls
    domains:
      - main: your-domain.com
        sans:
          - www.your-domain.com

---
# ── Convex Backend IngressRoute ─────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: easycv-convex
  namespace: easycv
  labels:
    app: easycv-convex
    app.kubernetes.io/part-of: easycv
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Convex API
    - match: Host(`convex.your-domain.com`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: easycv-rate-limit
        - name: easycv-cors
        - name: easycv-security-headers
        - name: easycv-https-redirect
      services:
        - name: convex-backend
          port: 3210

    # Convex HTTP actions
    - match: Host(`convex.your-domain.com`) && PathPrefix(`/http`)
      kind: Rule
      middlewares:
        - name: easycv-security-headers
        - name: easycv-https-redirect
      services:
        - name: convex-backend
          port: 3211

    # Convex Dashboard
    - match: Host(`convex.your-domain.com`)
      kind: Rule
      middlewares:
        - name: easycv-rate-limit
        - name: easycv-security-headers
        - name: easycv-https-redirect
      services:
        - name: convex-dashboard
          port: 6791

  tls:
    secretName: convex-tls
    domains:
      - main: convex.your-domain.com
