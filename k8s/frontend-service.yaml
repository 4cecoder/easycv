# =============================================================================
# easyCV Frontend Service — ClusterIP (Traefik handles external traffic)
# =============================================================================
#
# Traefik is the ingress controller and handles LoadBalancer exposure.
# This service is ClusterIP — Traefik routes to it internally.
#
# Apply:
#   kubectl apply -f k8s/frontend-service.yaml -n easycv
#
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: easycv-frontend
  namespace: easycv
  labels:
    app: easycv-frontend
    app.kubernetes.io/part-of: easycv
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app: easycv-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
