# =============================================================================
# easyCV Frontend Service — LoadBalancer
# =============================================================================
#
# Exposes the frontend via a Vultr-provisioned public Load Balancer.
# VKE automatically provisions a Vultr load balancer when type is LoadBalancer.
#
# Apply:
#   kubectl apply -f k8s/frontend-service.yaml -n easycv
#
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: easycv-frontend
  namespace: easycv
  labels:
    app: easycv-frontend
    app.kubernetes.io/part-of: easycv
    app.kubernetes.io/component: frontend
  annotations:
    # Vultr Cloud Controller Manager annotations
    # See: https://docs.vultr.com/kubernetes/how-to-use-load-balancers
    service.beta.kubernetes.io/vultr-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/vultr-loadbalancer-port: "80"
spec:
  type: LoadBalancer
  selector:
    app: easycv-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  # Preserve client source IPs (needed for rate limiting / logging)
  # externalTrafficPolicy: Local  # Uncomment if you need source IP preservation
