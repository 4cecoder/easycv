# Manual VKE create/destroy. Play these jobs from a master pipeline.
# They do not block image build/deploy (allow_failure + needs: []).
#
# Required GitLab CI/CD variables:
#   VULTR_API_KEY         Vultr account API key (Masked)
#   VULTR_S3_ACCESS_KEY   Object Storage access key (Masked)
#   VULTR_S3_SECRET_KEY   Object Storage secret key (Masked)
#   GITLAB_API_TOKEN      Project Access Token, Maintainer + api (Masked)
#                         cluster:apply writes the KUBECONFIG file variable after create.
#                         CI_JOB_TOKEN cannot update CI/CD variables.

# Terraform state: s3://easycvtfstate/vke/terraform.tfstate on atl2.vultrobjects.com
#
# Optional:
#   TF_VAR_node_quantity, TF_VAR_node_plan, TF_VAR_kubernetes_version, ...

.terraform:
  image:
    name: hashicorp/terraform:1.11.3
    entrypoint: [""]
  resource_group: vke
  timeout: 45m
  interruptible: false
  needs: []
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "0"
    TF_ROOT: terraform
    TF_STATE_NAME: vke
  before_script:
    - |
      set -eu
      if [ -z "${VULTR_API_KEY:-}" ]; then
        echo "Set VULTR_API_KEY as a masked GitLab CI/CD variable (Vultr account API key)."
        exit 1
      fi
      . "$CI_PROJECT_DIR/terraform/scripts/gitlab-init.sh"
      cd "$TF_ROOT"

cluster:apply:
  extends: .terraform
  stage: cluster
  environment:
    name: vke
    action: start
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      terraform apply -input=false -auto-approve
      terraform output available_kubernetes_versions
      terraform output cluster_id
      terraform output endpoint
      terraform output kubernetes_version
      terraform output -raw kube_config > /tmp/kubeconfig.yaml
      sh "$CI_PROJECT_DIR/terraform/scripts/update-gitlab-kubeconfig.sh" /tmp/kubeconfig.yaml
      rm -f /tmp/kubeconfig.yaml

cluster:destroy:
  extends: .terraform
  stage: cluster
  environment:
    name: vke
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      terraform destroy -input=false -auto-approve
      echo "VKE cluster destroyed. App LoadBalancer and nodes are gone; recreate with cluster:apply."
