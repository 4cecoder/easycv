[project]
name = "easycv-pipeline"
version = "0.1.0"
description = "CV/resume consolidation pipeline — scan, extract, consolidate, and generate tech-focused resumes using LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.117.0",
    "cactus-needle>=2.0.0",
    "convex>=0.7.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "psutil>=5.9.0",
]

[project.scripts]
easycv = "backend.pipeline:main"
easycv-automation = "automation.steer:main"

[tool.setuptools.packages.find]
include = ["backend*", "automation*"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
    "local: marks tests as developer-local / on-device benchmark tests (deselect in CI with '-m \"not local\"')",
]
