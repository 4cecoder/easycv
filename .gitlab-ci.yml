# easyCV — GitLab CI/CD
# Build images → push to Vultr Container Registry → deploy to VKE.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   VULTRCR_USERNAME   registry username          (Masked)
#   VULTRCR_PASSWORD   registry API key           (Masked)
#   KUBECONFIG         optional fallback; deploy prefers Terraform state kubeconfig
#   GITHUB_TOKEN       read access to 4cecoder/ui-kit (Masked)
#   VULTR_API_KEY      Vultr account API key for cluster:apply / cluster:destroy (Masked)
#
# App variables (worker will crash-loop until these exist):
#   NEXT_PUBLIC_CONVEX_URL
#   WORKER_SECRET
#
# Optional: CONVEX_URL, APP_URL, STRIPE_*, LLM_*, OPENAI_API_KEY, ANTHROPIC_API_KEY
# Optional: GITLAB_API_TOKEN (api scope) so cluster:apply can write KUBECONFIG

include:
  - local: terraform/.gitlab-ci.yml

stages:
  - cluster
  - build
  - deploy

variables:
  VULTRCR_HOST: atl.vultrcr.com
  VULTRCR_NAME: seridian
  K8S_NAMESPACE: easycv
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: 20

.docker:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker info
    - echo "$VULTRCR_PASSWORD" | docker login "${VULTRCR_HOST}/${VULTRCR_NAME}" -u "$VULTRCR_USERNAME" --password-stdin
  after_script:
    - docker logout "${VULTRCR_HOST}/${VULTRCR_NAME}" || true

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-worker:
  extends: .docker
  stage: build
  timeout: 45m
  script:
    - |
      IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-worker"
      docker build -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" -t "${IMAGE}:latest" -f Dockerfile .
      docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
      docker push "${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build-frontend:
  extends: .docker
  stage: build
  timeout: 45m
  script:
    - |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "GITHUB_TOKEN is required to install the private @bytecats/ui-kit package."
        exit 1
      fi
      IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-frontend"
      docker build \
        --build-arg "GITHUB_TOKEN=${GITHUB_TOKEN}" \
        --build-arg "NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}" \
        -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        -t "${IMAGE}:latest" \
        -f web/Dockerfile \
        web
      docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
      docker push "${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine/k8s:1.36.2
  resource_group: production
  environment:
    name: production
  needs:
    - build-worker
    - build-frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      apk add --no-cache curl jq unzip >/dev/null
      curl -fsSL -o /tmp/terraform.zip \
        "https://releases.hashicorp.com/terraform/1.11.3/terraform_1.11.3_linux_amd64.zip"
      unzip -o /tmp/terraform.zip -d /usr/local/bin >/dev/null
      rm -f /tmp/terraform.zip

      export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/vke"
      export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_USERNAME="gitlab-ci-token"
      export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
      export TF_HTTP_LOCK_METHOD="POST"
      export TF_HTTP_UNLOCK_METHOD="DELETE"
      export TF_HTTP_RETRY_WAIT_MIN="5"
      export TF_VAR_vultr_api_key="${VULTR_API_KEY:-}"

      terraform -chdir=terraform init -input=false -reconfigure
      terraform -chdir=terraform state pull > /tmp/tfstate.json
      echo "State outputs: $(jq -r '.outputs | keys | join(", ")' /tmp/tfstate.json)"
      echo "kube_config output length: $(jq -r '.outputs.kube_config.value | tostring | length' /tmp/tfstate.json)"

      terraform -chdir=terraform output -raw kube_config > /tmp/easycv.kubeconfig 2>/dev/null || true
      if ! grep -q "apiVersion" /tmp/easycv.kubeconfig 2>/dev/null; then
        jq -r '.resources[] | select(.type=="vultr_kubernetes") | .instances[].attributes.kube_config' /tmp/tfstate.json > /tmp/easycv.kubeconfig || true
      fi
      if grep -q "apiVersion" /tmp/easycv.kubeconfig 2>/dev/null; then
        :
      elif base64 -d /tmp/easycv.kubeconfig > /tmp/easycv.kubeconfig.decoded 2>/dev/null && grep -q "apiVersion" /tmp/easycv.kubeconfig.decoded; then
        mv /tmp/easycv.kubeconfig.decoded /tmp/easycv.kubeconfig
      else
        echo "Could not read kubeconfig from Terraform state. Re-run cluster:apply after this pipeline is on master."
        exit 1
      fi
      export KUBECONFIG=/tmp/easycv.kubeconfig
      echo "Using kubeconfig from Terraform state (current VKE cluster)"

      CLUSTER_IP="$(terraform -chdir=terraform output -raw cluster_ip 2>/dev/null || true)"
      if [ -z "$CLUSTER_IP" ] || [ "$CLUSTER_IP" = "null" ]; then
        CLUSTER_IP="$(jq -r '[.resources[] | select(.type=="vultr_kubernetes") | .instances[].attributes.ip] | first // empty' /tmp/tfstate.json)"
      fi
      rm -f /tmp/tfstate.json

      SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
      echo "API server in kubeconfig: $SERVER"
      HOST="$(printf '%s' "$SERVER" | sed -e 's#^https://##' -e 's#^http://##' -e 's#:.*$##')"
      CLUSTER_NAME="$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')"
      if [ -n "${CLUSTER_IP:-}" ] && [ "$CLUSTER_IP" != "null" ]; then
        echo "Pinning API server to cluster IP ${CLUSTER_IP} (tls-server-name ${HOST})"
        kubectl config set-cluster "$CLUSTER_NAME" --server="https://${CLUSTER_IP}:6443" --tls-server-name="$HOST" >/dev/null
      fi

      echo "Waiting for Kubernetes API..."
      n=0
      until kubectl cluster-info >/dev/null 2>&1; do
        n=$((n + 1))
        if [ "$n" -ge 36 ]; then
          echo "Kubernetes API did not become reachable. Re-run cluster:apply and check the kubeconfig is for the live cluster."
          kubectl cluster-info || true
          exit 1
        fi
        sleep 5
      done
      kubectl cluster-info
      kubectl apply -f k8s/namespace.yaml

      kubectl create secret docker-registry vultr-registry-credentials \
        --namespace "$K8S_NAMESPACE" \
        --docker-server="${VULTRCR_HOST}/${VULTRCR_NAME}" \
        --docker-username="$VULTRCR_USERNAME" \
        --docker-password="$VULTRCR_PASSWORD" \
        --dry-run=client -o yaml | kubectl apply -f -

      CONVEX_VALUE="${CONVEX_URL:-${NEXT_PUBLIC_CONVEX_URL:-}}"

      kubectl create secret generic easycv-secrets \
        --namespace "$K8S_NAMESPACE" \
        --from-literal="CONVEX_URL=${CONVEX_VALUE}" \
        --from-literal="NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-}" \
        --from-literal="APP_URL=${APP_URL:-}" \
        --from-literal="WORKER_SECRET=${WORKER_SECRET:-}" \
        --from-literal="STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}" \
        --from-literal="STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}" \
        --from-literal="STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}" \
        --from-literal="STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}" \
        --from-literal="OPENAI_API_KEY=${OPENAI_API_KEY:-}" \
        --from-literal="ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}" \
        --dry-run=client -o yaml | kubectl apply -f -

      kubectl create configmap easycv-config \
        --namespace "$K8S_NAMESPACE" \
        --from-literal="NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-}" \
        --from-literal="LLM_PROVIDER=${LLM_PROVIDER:-ollama}" \
        --from-literal="LLM_MODEL=${LLM_MODEL:-}" \
        --from-literal="OLLAMA_API_BASE=${OLLAMA_API_BASE:-}" \
        --from-literal="APP_URL=${APP_URL:-}" \
        --dry-run=client -o yaml | kubectl apply -f -

      WORKER_IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-worker:${CI_COMMIT_SHORT_SHA}"
      FRONTEND_IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-frontend:${CI_COMMIT_SHORT_SHA}"

      sed "s|atl.vultrcr.com/seridian/easycv-worker:latest|${WORKER_IMAGE}|g" k8s/worker-deployment.yaml | kubectl apply -f -
      sed "s|atl.vultrcr.com/seridian/easycv-frontend:latest|${FRONTEND_IMAGE}|g" k8s/frontend-deployment.yaml | kubectl apply -f -
      kubectl apply -f k8s/frontend-service.yaml

      kubectl rollout status deployment/easycv-frontend -n "$K8S_NAMESPACE" --timeout=300s
      kubectl rollout status deployment/easycv-worker -n "$K8S_NAMESPACE" --timeout=300s

      echo "Frontend LoadBalancer (may take a few minutes to get an IP):"
      kubectl get svc easycv-frontend -n "$K8S_NAMESPACE"
      kubectl get pods -n "$K8S_NAMESPACE"
