# easyCV — GitLab CI/CD
# Build images → push to Vultr Container Registry → deploy to VKE.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   VULTRCR_USERNAME   registry username          (Masked)
#   VULTRCR_PASSWORD   registry API key           (Masked)
#   KUBECONFIG             optional fallback; deploy reads kubeconfig from Terraform state.
#                          cluster:apply rewrites this file variable when GITLAB_API_TOKEN is set.
#   GITHUB_TOKEN       read access to 4cecoder/ui-kit (Masked)
#   VULTR_API_KEY          Vultr account API key for cluster:apply / cluster:destroy (Masked)
#   VULTR_S3_ACCESS_KEY    Object Storage access key (Masked) — terraform state
#   VULTR_S3_SECRET_KEY    Object Storage secret key (Masked) — terraform state
#
# App variables:
#   NEXT_PUBLIC_CONVEX_URL
#   WORKER_SECRET
#
# Required for production deploys: CONVEX_DEPLOY_KEY, SERIDIAN_AUTH_ISSUER,
#   SERIDIAN_AUTH_CLIENT_ID, SERIDIAN_AUTH_CLIENT_SECRET, ADMIN_EMAILS,
#   APP_URL, Stripe credentials and price IDs, LLM_PROVIDER, and the selected
#   provider API key, and NETLIFY_AUTH_TOKEN. NETLIFY_SITE_ID is the fixed
#   production site id below; the Netlify job deploys the public web frontend.
# Optional: LLM_MODEL, OLLAMA_API_BASE
# Required for KUBECONFIG sync: GITLAB_API_TOKEN (Project Access Token, Maintainer, api)

include:
  - local: terraform/.gitlab-ci.yml

stages:
  - cluster
  - verify
  - build
  - configure
  - deploy

variables:
  VULTRCR_HOST: atl.vultrcr.com
  VULTRCR_NAME: seridian
  K8S_NAMESPACE: easycv
  NETLIFY_SITE_ID: a6ab07c1-3db7-4c24-b643-7d35769b5546
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: 20
  TF_STATE_NAME: vke

.docker:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - docker info
    - echo "$VULTRCR_PASSWORD" | docker login "${VULTRCR_HOST}/${VULTRCR_NAME}" -u "$VULTRCR_USERNAME" --password-stdin
  after_script:
    - docker logout "${VULTRCR_HOST}/${VULTRCR_NAME}" || true

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

verify-lockfile:
  stage: verify
  image: oven/bun:1
  script:
    - |
      if [ -n "${GITHUB_TOKEN:-}" ]; then
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
      fi
      cd web && bun install --frozen-lockfile
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

production-preflight:
  stage: verify
  image: alpine:3.22
  script:
    - |
      set -eu
      for name in NEXT_PUBLIC_CONVEX_URL CONVEX_DEPLOY_KEY SERIDIAN_AUTH_ISSUER SERIDIAN_AUTH_CLIENT_ID SERIDIAN_AUTH_CLIENT_SECRET ADMIN_EMAILS APP_URL WORKER_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID STRIPE_PRO_PRICE_ID NETLIFY_AUTH_TOKEN; do
        value="$(printenv "$name" || true)"
        if [ -z "$value" ]; then echo "$name is required for a production EasyCV cutover" >&2; exit 1; fi
      done
      if [ "$SERIDIAN_AUTH_ISSUER" != "https://auth.seridian.dev" ]; then
        echo "SERIDIAN_AUTH_ISSUER must exactly match https://auth.seridian.dev" >&2; exit 1
      fi
      if [ "$APP_URL" != "https://easycv.seridian.dev" ]; then
        echo "APP_URL must exactly match the canonical EasyCV production origin https://easycv.seridian.dev" >&2; exit 1
      fi
      LLM_PROVIDER="${LLM_PROVIDER:-openai}"
      case "$LLM_PROVIDER" in
        openai) [ -n "${OPENAI_API_KEY:-}" ] || { echo "LLM_PROVIDER=openai requires OPENAI_API_KEY" >&2; exit 1; } ;;
        anthropic) [ -n "${ANTHROPIC_API_KEY:-}" ] || { echo "LLM_PROVIDER=anthropic requires ANTHROPIC_API_KEY" >&2; exit 1; } ;;
        *) echo "LLM_PROVIDER must be openai or anthropic" >&2; exit 1 ;;
      esac
      case "$NEXT_PUBLIC_CONVEX_URL" in https://*.convex.cloud) ;; *) echo "NEXT_PUBLIC_CONVEX_URL must identify the production Convex Cloud deployment" >&2; exit 1 ;; esac
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

configure-convex-auth:
  stage: configure
  image: oven/bun:1
  script:
    - |
      set -eu
      : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to install the private UI kit}"
      git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
      cd web && bun install --frozen-lockfile
    - |
      set -eu
      for name in SERIDIAN_AUTH_ISSUER SERIDIAN_AUTH_CLIENT_ID ADMIN_EMAILS WORKER_SECRET APP_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID STRIPE_PRO_PRICE_ID; do
        bunx convex env set --force "$name" "$(printenv "$name")"
      done
      bunx convex deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build-worker:
  extends: .docker
  stage: build
  timeout: 45m
  script:
    - |
      IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-worker"
      docker build -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" -t "${IMAGE}:latest" -f Dockerfile .
      docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
      docker push "${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build-frontend:
  extends: .docker
  stage: build
  timeout: 45m
  script:
    - |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "GITHUB_TOKEN is required to install the private @bytecats/ui-kit package."
        exit 1
      fi
      IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-frontend"
      docker build \
        --build-arg "GITHUB_TOKEN=${GITHUB_TOKEN}" \
        --build-arg "NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}" \
        -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        -t "${IMAGE}:latest" \
        -f web/Dockerfile \
        web
      docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
      docker push "${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine/k8s:1.36.2
  # Same group as cluster:apply/destroy so jobs never race on the S3 state file.
  resource_group: vke
  environment:
    name: production
  needs:
    - build-worker
    - build-frontend
    - configure-convex-auth
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      apk add --no-cache curl jq unzip >/dev/null
      curl -fsSL -o /tmp/terraform.zip \
        "https://releases.hashicorp.com/terraform/1.11.3/terraform_1.11.3_linux_amd64.zip"
      unzip -o /tmp/terraform.zip -d /usr/local/bin >/dev/null
      rm -f /tmp/terraform.zip

      . "$CI_PROJECT_DIR/terraform/scripts/gitlab-init.sh"
      terraform -chdir=terraform state pull > /tmp/tfstate.json
      echo "State outputs: $(jq -r '.outputs | keys | join(", ")' /tmp/tfstate.json)"

      sh "$CI_PROJECT_DIR/terraform/scripts/export-kubeconfig.sh" /tmp/easycv.kubeconfig
      export KUBECONFIG=/tmp/easycv.kubeconfig
      echo "Using kubeconfig from Terraform state (current VKE cluster)"

      # Reject a partially configured release before touching Kubernetes.
      : "${NEXT_PUBLIC_CONVEX_URL:?NEXT_PUBLIC_CONVEX_URL is required}"
      : "${SERIDIAN_AUTH_ISSUER:?SERIDIAN_AUTH_ISSUER is required}"
      : "${SERIDIAN_AUTH_CLIENT_ID:?SERIDIAN_AUTH_CLIENT_ID is required}"
      : "${SERIDIAN_AUTH_CLIENT_SECRET:?SERIDIAN_AUTH_CLIENT_SECRET is required}"
      : "${ADMIN_EMAILS:?ADMIN_EMAILS is required}"
      : "${APP_URL:?APP_URL is required}"
      : "${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required to preserve billing}"
      : "${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required to preserve billing}"
      : "${STRIPE_PRICE_ID:?STRIPE_PRICE_ID is required to preserve billing}"
      : "${STRIPE_PRO_PRICE_ID:?STRIPE_PRO_PRICE_ID is required to preserve billing}"
      LLM_PROVIDER="${LLM_PROVIDER:-openai}"
      case "$LLM_PROVIDER" in
        openai) : "${OPENAI_API_KEY:?OPENAI_API_KEY is required for OpenAI inference}" ;;
        anthropic) : "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required for Anthropic inference}" ;;
        *) echo "Unsupported production LLM_PROVIDER: $LLM_PROVIDER" >&2; exit 1 ;;
      esac

      CLUSTER_IP="$(terraform -chdir=terraform output -raw cluster_ip 2>/dev/null || true)"
      if [ -z "$CLUSTER_IP" ] || [ "$CLUSTER_IP" = "null" ]; then
        CLUSTER_IP="$(jq -r '[.resources[] | select(.type=="vultr_kubernetes") | .instances[].attributes.ip] | first // empty' /tmp/tfstate.json)"
      fi
      rm -f /tmp/tfstate.json

      SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
      echo "API server in kubeconfig: $SERVER"
      HOST="$(printf '%s' "$SERVER" | sed -e 's#^https://##' -e 's#^http://##' -e 's#:.*$##')"
      CLUSTER_NAME="$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')"
      if [ -n "${CLUSTER_IP:-}" ] && [ "$CLUSTER_IP" != "null" ]; then
        echo "Pinning API server to cluster IP ${CLUSTER_IP} (tls-server-name ${HOST})"
        kubectl config set-cluster "$CLUSTER_NAME" --server="https://${CLUSTER_IP}:6443" --tls-server-name="$HOST" >/dev/null
      fi

      echo "Waiting for Kubernetes API..."
      n=0
      until kubectl cluster-info >/dev/null 2>&1; do
        n=$((n + 1))
        if [ "$n" -ge 36 ]; then
          echo "Kubernetes API did not become reachable. Re-run cluster:apply and check the kubeconfig is for the live cluster."
          kubectl cluster-info || true
          exit 1
        fi
        sleep 5
      done
      kubectl cluster-info
      kubectl apply -f k8s/namespace.yaml

      kubectl create secret docker-registry vultr-registry-credentials \
        --namespace "$K8S_NAMESPACE" \
        --docker-server="${VULTRCR_HOST}/${VULTRCR_NAME}" \
        --docker-username="$VULTRCR_USERNAME" \
        --docker-password="$VULTRCR_PASSWORD" \
        --dry-run=client -o yaml | kubectl apply -f -

      # Keep the frontend, worker, and Convex CLI on one deployment.
      CONVEX_VALUE="$NEXT_PUBLIC_CONVEX_URL"

      WORKER_SECRET="${WORKER_SECRET:-$(openssl rand -hex 32)}"
      echo "Using WORKER_SECRET (auto-generated if not set)"

      kubectl create secret generic easycv-secrets \
        --namespace "$K8S_NAMESPACE" \
        --from-literal="INSTANCE_SECRET=${INSTANCE_SECRET:-}" \
        --from-literal="POSTGRES_URL=${POSTGRES_URL:-}" \
        --from-literal="POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}" \
        --from-literal="CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY:-}" \
        --dry-run=client -o yaml | kubectl apply -f -

      kubectl create secret generic easycv-web-secrets \
        --namespace "$K8S_NAMESPACE" \
        --from-literal="SERIDIAN_AUTH_ISSUER=${SERIDIAN_AUTH_ISSUER}" \
        --from-literal="SERIDIAN_AUTH_CLIENT_ID=${SERIDIAN_AUTH_CLIENT_ID}" \
        --from-literal="SERIDIAN_AUTH_CLIENT_SECRET=${SERIDIAN_AUTH_CLIENT_SECRET}" \
        --from-literal="ADMIN_EMAILS=${ADMIN_EMAILS}" \
        --from-literal="STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}" \
        --from-literal="STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}" \
        --from-literal="STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}" \
        --from-literal="STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}" \
        --from-literal="OPENAI_API_KEY=${OPENAI_API_KEY:-}" \
        --from-literal="ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}" \
        --dry-run=client -o yaml | kubectl apply -f -

      kubectl create secret generic easycv-worker-secrets \
        --namespace "$K8S_NAMESPACE" \
        --from-literal="CONVEX_URL=${CONVEX_VALUE}" \
        --from-literal="WORKER_SECRET=${WORKER_SECRET}" \
        --from-literal="OPENAI_API_KEY=${OPENAI_API_KEY:-}" \
        --from-literal="ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}" \
        --dry-run=client -o yaml | kubectl apply -f -

      kubectl create configmap easycv-config \
        --namespace "$K8S_NAMESPACE" \
        --from-literal="NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-}" \
        --from-literal="LLM_PROVIDER=${LLM_PROVIDER:-openai}" \
        --from-literal="LLM_MODEL=${LLM_MODEL:-gpt-4o}" \
        --from-literal="OLLAMA_API_BASE=${OLLAMA_API_BASE:-}" \
        --from-literal="APP_URL=${APP_URL}" \
        --dry-run=client -o yaml | kubectl apply -f -

      WORKER_IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-worker:${CI_COMMIT_SHORT_SHA}"
      FRONTEND_IMAGE="${VULTRCR_HOST}/${VULTRCR_NAME}/easycv-frontend:${CI_COMMIT_SHORT_SHA}"

      sed "s|atl.vultrcr.com/seridian/easycv-worker:latest|${WORKER_IMAGE}|g" k8s/worker-deployment.yaml | kubectl apply -f -
      sed "s|atl.vultrcr.com/seridian/easycv-frontend:latest|${FRONTEND_IMAGE}|g" k8s/frontend-deployment.yaml | kubectl apply -f -
      kubectl apply -f k8s/frontend-service.yaml

      if ! kubectl rollout status deployment/easycv-frontend -n "$K8S_NAMESPACE" --timeout=300s; then
        echo "Frontend rollout failed. Cluster snapshot:"
        kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
        kubectl describe deployment/easycv-frontend -n "$K8S_NAMESPACE" || true
        kubectl describe pods -n "$K8S_NAMESPACE" -l app=easycv-frontend || true
        exit 1
      fi
      if ! kubectl rollout status deployment/easycv-worker -n "$K8S_NAMESPACE" --timeout=300s; then
        echo "Worker rollout failed. Cluster snapshot:"
        kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
        kubectl describe deployment/easycv-worker -n "$K8S_NAMESPACE" || true
        kubectl describe pods -n "$K8S_NAMESPACE" -l app=easycv-worker || true
        exit 1
      fi

      echo "Frontend LoadBalancer (may take a few minutes to get an IP):"
      kubectl get svc easycv-frontend -n "$K8S_NAMESPACE"
      kubectl get pods -n "$K8S_NAMESPACE"

# Netlify is the current public EasyCV origin. The Kubernetes frontend is not
# enough to cut over https://easycv.seridian.dev, so publish the same source to
# the linked production Netlify site as part of every production release.
deploy-netlify:
  stage: deploy
  image: oven/bun:1
  environment:
    name: production
    url: https://easycv.seridian.dev
  needs:
    - configure-convex-auth
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN is required to deploy the public production site}"
      : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to install the private UI kit}"
      git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
      cd web
      export NETLIFY_AUTH_TOKEN
      export NETLIFY_SITE_ID
      for name in NEXT_PUBLIC_CONVEX_URL CONVEX_URL APP_URL SERIDIAN_AUTH_ISSUER SERIDIAN_AUTH_CLIENT_ID ADMIN_EMAILS STRIPE_PRICE_ID STRIPE_PRO_PRICE_ID LLM_PROVIDER LLM_MODEL; do
        value="$(printenv "$name" || true)"
        if [ -n "$value" ]; then
          bunx netlify-cli env:set "$name" "$value" --context production --force
        fi
      done
      for name in SERIDIAN_AUTH_CLIENT_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET WORKER_SECRET OPENAI_API_KEY ANTHROPIC_API_KEY; do
        value="$(printenv "$name" || true)"
        if [ -n "$value" ]; then
          bunx netlify-cli env:set "$name" "$value" --context production --secret --force
        fi
      done
      bunx netlify-cli deploy --build --prod --site "$NETLIFY_SITE_ID" --message "EasyCV ${CI_COMMIT_SHORT_SHA}"
